{{ define "main" }}
  <h1>{{ .Title }}</h1>
  <ul class="post-list">
    {{ range .Pages }}
      <li class="post-item">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <time>{{ .Date.Format "2006-01-02" }}</time>
        {{ if .Params.summary }}<p>{{ .Params.summary }}</p>{{ end }}
      </li>
    {{ end }}
  </ul>
{{ end }}
